<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>🎤 Karaoke Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #1a0533, #2d1b69);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 20px rgba(128, 0, 255, 0.3);
            z-index: 10;
        }

        .header h1 {
            font-size: 1.2rem;
            background: linear-gradient(90deg, #ff6ec7, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .server-status {
            font-size: 0.6rem;
            padding: 2px 7px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .server-status.online { background: rgba(0,200,0,0.2); color: #0f0; }
        .server-status.offline { background: rgba(200,0,0,0.2); color: #f55; }

        .search-box {
            display: flex;
            gap: 6px;
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 22px;
            border: 2px solid #7c4dff;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus { border-color: #ff6ec7; box-shadow: 0 0 12px rgba(255,110,199,0.3); }
        .search-box input::placeholder { color: rgba(255,255,255,0.4); }

        .search-btn {
            padding: 8px 16px;
            border-radius: 22px;
            border: none;
            background: linear-gradient(135deg, #7c4dff, #ff6ec7);
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        /* ===== Main ===== */
        .main {
            display: grid;
            grid-template-columns: 1fr 340px;
            grid-template-rows: 1fr auto;
            height: calc(100vh - 50px);
            height: calc(100dvh - 50px);
        }

        /* ===== Video ===== */
        .video-area {
            grid-column: 1;
            grid-row: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder { text-align: center; color: rgba(255,255,255,0.2); }
        .placeholder .icon { font-size: 4rem; margin-bottom: 10px; }
        .placeholder p { font-size: 0.85rem; }

        #player { width: 100%; height: 100%; }

        /* Fullscreen button */
        .fs-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.4rem;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
            line-height: 1;
        }

        .fs-btn:hover { background: rgba(124,77,255,0.6); }

        /* ===== Controls ===== */
        .controls-bar {
            grid-column: 1;
            grid-row: 2;
            background: #111;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrls { display: flex; gap: 4px; }

        .ctrl {
            background: none; border: none; color: #fff;
            font-size: 1.2rem; cursor: pointer; padding: 5px;
            border-radius: 50%; transition: all 0.2s;
        }

        .ctrl:hover { background: rgba(255,255,255,0.1); }

        .time {
            font-size: 0.75rem; color: rgba(255,255,255,0.5);
            min-width: 36px; text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .progress {
            flex: 1; height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px; cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7c4dff, #ff6ec7);
            border-radius: 3px; width: 0%;
        }

        .vol { width: 50px; accent-color: #7c4dff; cursor: pointer; }

        /* ===== Sidebar ===== */
        .sidebar {
            grid-column: 2;
            grid-row: 1 / 3;
            background: #0f0f23;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(124,77,255,0.2);
            transition: transform 0.3s;
        }

        .tabs { display: flex; background: #111; }

        .tab {
            flex: 1; padding: 10px; text-align: center;
            cursor: pointer; font-weight: bold; font-size: 0.78rem;
            color: rgba(255,255,255,0.4);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active { color: #ff6ec7; border-bottom-color: #ff6ec7; }

        .now-playing {
            background: linear-gradient(135deg, #1a0533, #2d1b69);
            padding: 6px 10px;
            display: none; align-items: center; gap: 7px;
            border-bottom: 1px solid rgba(124,77,255,0.2);
        }

        .np-dot {
            width: 6px; height: 6px; background: #ff6ec7;
            border-radius: 50%; animation: pulse 1.2s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .now-playing .np-title {
            font-size: 0.75rem; font-weight: 600;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; flex: 1;
        }

        .quick-tags {
            display: flex; gap: 4px; flex-wrap: wrap;
            padding: 7px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            overflow-x: auto;
        }

        .qt {
            padding: 3px 9px; border-radius: 12px;
            border: 1px solid rgba(124,77,255,0.3);
            background: transparent; color: rgba(255,255,255,0.45);
            font-size: 0.68rem; cursor: pointer; white-space: nowrap;
        }

        .qt:hover, .qt:active { border-color: #ff6ec7; color: #ff6ec7; }

        .content {
            flex: 1; overflow-y: auto; padding: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .content::-webkit-scrollbar { width: 3px; }
        .content::-webkit-scrollbar-thumb { background: #7c4dff; border-radius: 2px; }

        .pane { display: none; }
        .pane.active { display: block; }

        .song {
            display: flex; gap: 8px; padding: 8px;
            border-radius: 8px; cursor: pointer;
            transition: all 0.15s; align-items: center;
        }

        .song:hover, .song:active { background: rgba(124,77,255,0.1); }
        .song.playing { background: rgba(255,110,199,0.1); border: 1px solid rgba(255,110,199,0.2); }

        .song-thumb {
            width: 72px; height: 44px; border-radius: 5px;
            object-fit: cover; flex-shrink: 0; background: #222;
        }

        .song-info { flex: 1; min-width: 0; }

        .song-title {
            font-size: 0.76rem; font-weight: 600;
            margin-bottom: 1px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        .song-meta { font-size: 0.65rem; color: rgba(255,255,255,0.3); }

        .song-act { display: flex; gap: 2px; }

        .act {
            background: none; border: none;
            color: rgba(255,255,255,0.3); cursor: pointer;
            padding: 4px 6px; border-radius: 4px;
            font-size: 0.9rem;
        }

        .act:hover, .act:active { color: #ff6ec7; }
        .act.added { color: #0f0; }

        .loading { text-align: center; padding: 30px; color: rgba(255,255,255,0.3); }

        .spinner {
            display: inline-block; width: 22px; height: 22px;
            border: 3px solid rgba(124,77,255,0.2);
            border-top-color: #7c4dff; border-radius: 50%;
            animation: spin 0.7s linear infinite; margin-bottom: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; padding: 25px 12px; color: rgba(255,255,255,0.2); }
        .empty .icon { font-size: 2.2rem; margin-bottom: 6px; }
        .empty p { font-size: 0.78rem; }

        /* Mobile toggle button */
        .sidebar-toggle {
            display: none;
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(124,77,255,0.8);
            border: none; color: #fff;
            font-size: 1.3rem; padding: 8px 10px;
            border-radius: 8px; cursor: pointer; z-index: 6;
        }

        /* ===== Fullscreen Mode ===== */
        .video-area:fullscreen,
        .video-area:-webkit-full-screen {
            background: #000;
        }

        body.fs-mode .header,
        body.fs-mode .controls-bar,
        body.fs-mode .sidebar { display: none !important; }

        body.fs-mode .main {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            height: 100vh;
            height: 100dvh;
        }

        body.fs-mode .video-area {
            grid-column: 1; grid-row: 1;
        }

        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            .header { padding: 8px 10px; gap: 8px; flex-wrap: wrap; }
            .header h1 { font-size: 1rem; }
            .server-status { display: none; }

            .search-box { max-width: 100%; order: 10; flex-basis: 100%; }
            .search-box input { font-size: 1rem; padding: 10px 14px; }
            .search-btn { padding: 10px 14px; }

            .main {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                height: calc(100vh - 90px);
                height: calc(100dvh - 90px);
                position: relative;
            }

            .video-area {
                grid-column: 1; grid-row: 1;
                min-height: 45vw;
                max-height: 50vh;
            }

            .controls-bar { grid-column: 1; grid-row: 2; }

            .sidebar {
                position: fixed;
                top: 0; right: 0; bottom: 0;
                width: 85vw; max-width: 360px;
                z-index: 100;
                transform: translateX(100%);
                box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            }

            .sidebar.open { transform: translateX(0); }

            .sidebar-toggle { display: block; }

            .sidebar-overlay {
                display: none;
                position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 99;
            }

            .sidebar-overlay.show { display: block; }

            .quick-tags { flex-wrap: nowrap; overflow-x: auto; }
        }

        @media (max-width: 400px) {
            .header h1 { font-size: 0.9rem; }
            .vol { width: 40px; }
            .time { font-size: 0.7rem; min-width: 30px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎤 Karaoke</h1>
        <span class="server-status offline" id="status">⏳</span>
        <div class="search-box">
            <input type="text" id="q" placeholder="ค้นหาเพลงคาราโอเกะ..." />
            <button class="search-btn" onclick="doSearch()">🔍</button>
        </div>
    </div>

    <div class="sidebar-toggle" id="sideToggle" onclick="toggleSidebar()">🎵</div>
    <div class="sidebar-overlay" id="sideOverlay" onclick="toggleSidebar()"></div>

    <div class="main">
        <div class="video-area" id="videoArea">
            <div id="ph" class="placeholder">
                <div class="icon">🎤</div>
                <p>ค้นหาเพลงคาราโอเกะแล้วเริ่มร้องเลย!</p>
            </div>
            <div id="player" style="display:none"></div>
            <button class="fs-btn" id="fsBtn" onclick="toggleFS()" title="ขยายเต็มจอ">⛶</button>
        </div>

        <div class="controls-bar">
            <div class="ctrls">
                <button class="ctrl" onclick="prev()">⏮</button>
                <button class="ctrl" id="pp" onclick="togglePlay()">▶️</button>
                <button class="ctrl" onclick="next()">⏭</button>
            </div>
            <span class="time" id="cur">0:00</span>
            <div class="progress" id="pbar" onclick="seek(event)" ontouchstart="seek(event)">
                <div class="progress-fill" id="pfill"></div>
            </div>
            <span class="time" id="dur">0:00</span>
            <span style="color:rgba(255,255,255,0.3);font-size:0.8rem">🔊</span>
            <input type="range" class="vol" min="0" max="100" value="80" oninput="setVol(this.value)" />
        </div>

        <div class="sidebar" id="sidebar">
            <div class="tabs">
                <div class="tab active" onclick="swTab('r')">🔍 ผลการค้นหา</div>
                <div class="tab" onclick="swTab('p')">🎵 Playlist (<span id="pc">0</span>)</div>
            </div>
            <div class="now-playing" id="np">
                <div class="np-dot"></div>
                <span class="np-title" id="npt">-</span>
            </div>
            <div class="quick-tags">
                <button class="qt" onclick="qs('ลูกอม คาราโอเกะ')">ลูกอม</button>
                <button class="qt" onclick="qs('คนเก่ง คาราโอเกะ')">คนเก่ง</button>
                <button class="qt" onclick="qs('แพ้ทาง คาราโอเกะ')">แพ้ทาง</button>
                <button class="qt" onclick="qs('ปล่อย คาราโอเกะ')">ปล่อย</button>
                <button class="qt" onclick="qs('รถแห่ คาราโอเกะ')">รถแห่</button>
                <button class="qt" onclick="qs('ผู้สาวขาเลาะ คาราโอเกะ')">ผู้สาวขาเลาะ</button>
                <button class="qt" onclick="qs('กอดเสาเถียง คาราโอเกะ')">กอดเสาเถียง</button>
                <button class="qt" onclick="qs('say so karaoke')">Say So</button>
            </div>
            <div class="content">
                <div class="pane active" id="rp">
                    <div class="empty" id="re">
                        <div class="icon">🔍</div>
                        <p>ค้นหาเพลงคาราโอเกะได้เลย!</p>
                    </div>
                    <div id="rl"></div>
                </div>
                <div class="pane" id="pp2">
                    <div class="empty" id="pe">
                        <div class="icon">🎵</div>
                        <p>ยังไม่มีเพลงใน Playlist</p>
                        <p style="font-size:0.7rem;margin-top:4px">กด ➕ เพิ่มเพลง</p>
                    </div>
                    <div id="pl"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        let player, vid, playing = false, results = [], plist = JSON.parse(localStorage.getItem('kp')||'[]'), plIdx = -1, prog, fsMode = false;

        // ===== YouTube IFrame =====
        const t = document.createElement('script');
        t.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(t);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, fs: 0, iv_load_policy: 3 },
                events: { onReady: () => player.setVolume(80), onStateChange: onState }
            });
        }

        function onState(e) {
            if (e.data === YT.PlayerState.ENDED) next();
            playing = e.data === YT.PlayerState.PLAYING;
            document.getElementById('pp').textContent = playing ? '⏸' : '▶️';
            playing ? startProg() : stopProg();
        }

        // ===== Server Check =====
        async function chk() {
            const el = document.getElementById('status');
            try {
                const r = await fetch(API + '/api/health', { signal: AbortSignal.timeout(3000) });
                const d = await r.json();
                if (d.status === 'ok') { el.className = 'server-status online'; el.textContent = '🟢'; return; }
            } catch {}
            el.className = 'server-status offline'; el.textContent = '🔴';
        }
        chk(); setInterval(chk, 15000);

        // ===== Search =====
        async function doSearch(q) {
            q = q || document.getElementById('q').value.trim();
            if (!q) return;
            document.getElementById('q').value = q;
            document.getElementById('re').style.display = 'none';
            document.getElementById('rl').innerHTML = '<div class="loading"><div class="spinner"></div><p>กำลังค้นหา...</p></div>';
            swTab('r');
            // Close sidebar on mobile after search
            if (window.innerWidth <= 768) closeSidebar();
            try {
                const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`, { signal: AbortSignal.timeout(30000) });
                const d = await r.json();
                if (d.error) throw new Error(d.error);
                results = d.results || [];
                renderR();
            } catch (e) {
                document.getElementById('rl').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
            }
        }

        function qs(t) { document.getElementById('q').value = t; doSearch(t); }

        // ===== Render =====
        function renderR() {
            const el = document.getElementById('rl');
            if (!results.length) { el.innerHTML = '<div class="empty"><div class="icon">😢</div><p>ไม่พบผลลัพธ์</p></div>'; return; }
            el.innerHTML = results.map((s, i) => {
                const inP = plist.some(p => p.id === s.id);
                return `<div class="song ${vid===s.id?'playing':''}" onclick="play('${s.id}',\`${s.title.replace(/`/g,'\\`')}\`)">
                    <img class="song-thumb" src="${s.thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${s.id}/mqdefault.jpg'">
                    <div class="song-info"><div class="song-title">${s.title}</div><div class="song-meta">${s.channel}${s.duration?' · '+s.duration:''}</div></div>
                    <div class="song-act"><button class="act ${inP?'added':''}" onclick="event.stopPropagation();addPl(${i})">${inP?'✅':'➕'}</button></div>
                </div>`;
            }).join('');
        }

        // ===== Player =====
        function play(id, title) {
            if (!id || !player) return;
            vid = id;
            document.getElementById('ph').style.display = 'none';
            document.getElementById('player').style.display = 'block';
            player.loadVideoById(id);
            document.getElementById('np').style.display = 'flex';
            document.getElementById('npt').textContent = title;
            const pi = plist.findIndex(p => p.id === id);
            if (pi >= 0) plIdx = pi;
            renderR(); renderP();
            // Auto fullscreen on mobile
            if (window.innerWidth <= 768 && !fsMode) enterFS();
        }

        function togglePlay() { if (!player) return; playing ? player.pauseVideo() : player.playVideo(); }
        function prev() { if (!plist.length) return; plIdx = (plIdx-1+plist.length)%plist.length; play(plist[plIdx].id, plist[plIdx].title); }
        function next() { if (!plist.length) return; plIdx = (plIdx+1)%plist.length; play(plist[plIdx].id, plist[plIdx].title); }
        function setVol(v) { if (player?.setVolume) player.setVolume(v); }

        // ===== Fullscreen =====
        function toggleFS() {
            fsMode ? exitFS() : enterFS();
        }

        function enterFS() {
            const el = document.getElementById('videoArea');
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else {
                // Fallback: CSS fullscreen
                fsMode = true;
                document.body.classList.add('fs-mode');
                document.getElementById('fsBtn').textContent = '⛶';
            }
        }

        function exitFS() {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else {
                fsMode = false;
                document.body.classList.remove('fs-mode');
                document.getElementById('fsBtn').textContent = '⛶';
            }
        }

        document.addEventListener('fullscreenchange', onFSChange);
        document.addEventListener('webkitfullscreenchange', onFSChange);

        function onFSChange() {
            fsMode = !!document.fullscreenElement || !!document.webkitFullscreenElement;
            document.body.classList.toggle('fs-mode', fsMode);
            document.getElementById('fsBtn').textContent = fsMode ? '⛶' : '⛶';
        }

        // ===== Progress =====
        function startProg() { stopProg(); prog = setInterval(updProg, 500); }
        function stopProg() { if (prog) clearInterval(prog); }
        function updProg() {
            if (!player?.getDuration) return;
            const c = player.getCurrentTime()||0, t = player.getDuration()||0;
            document.getElementById('pfill').style.width = (t>0?(c/t)*100:0)+'%';
            document.getElementById('cur').textContent = fmt(c);
            document.getElementById('dur').textContent = fmt(t);
        }
        function seek(e) {
            if (!player?.getDuration) return;
            const b = document.getElementById('pbar');
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.seekTo(((clientX-b.getBoundingClientRect().left)/b.width)*player.getDuration(), true);
        }

        // ===== Playlist =====
        function addPl(i) {
            const s = results[i]; if (!s||plist.some(p=>p.id===s.id)) return;
            plist.push({id:s.id,title:s.title,channel:s.channel,thumb:s.thumb});
            saveP(); renderP(); renderR();
        }
        function rmPl(i) { plist.splice(i,1); if(plIdx>=plist.length)plIdx=plist.length-1; saveP();renderP();renderR(); }
        function playPl(i) { plIdx=i; play(plist[i].id,plist[i].title); }
        function saveP() { localStorage.setItem('kp',JSON.stringify(plist)); document.getElementById('pc').textContent=plist.length; }
        function renderP() {
            const el=document.getElementById('pl'), em=document.getElementById('pe');
            document.getElementById('pc').textContent=plist.length;
            if(!plist.length){em.style.display='block';el.innerHTML='';return;}
            em.style.display='none';
            el.innerHTML=plist.map((s,i)=>`<div class="song ${plIdx===i?'playing':''}" onclick="playPl(${i})">
                <img class="song-thumb" src="${s.thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${s.id}/mqdefault.jpg'">
                <div class="song-info"><div class="song-title">${s.title}</div><div class="song-meta">${s.channel}</div></div>
                <div class="song-act"><button class="act" onclick="event.stopPropagation();rmPl(${i})">🗑️</button></div>
            </div>`).join('');
        }

        // ===== Tabs =====
        function swTab(t) {
            document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
            document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
            if(t==='r'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('rp').classList.add('active');}
            else{document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('pp2').classList.add('active');}
        }

        // ===== Sidebar Toggle (Mobile) =====
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sideOverlay');
            sb.classList.toggle('open');
            ov.classList.toggle('show');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sideOverlay').classList.remove('show');
        }

        // ===== Helpers =====
        function fmt(s) { s=Math.floor(s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }

        document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
        renderP();
    </script>
</body>
</html>
