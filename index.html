<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🎤 Karaoke Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #1a0533, #2d1b69);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 15px rgba(128,0,255,0.3);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.3rem;
            background: linear-gradient(90deg, #ff6ec7, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .karaoke-toggle {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 20px;
            border: 1px solid rgba(124,77,255,0.3);
            background: rgba(255,255,255,0.05);
            cursor: pointer; white-space: nowrap;
            font-size: 0.8rem; color: rgba(255,255,255,0.5);
            transition: all 0.2s;
            user-select: none;
        }

        .karaoke-toggle.active {
            border-color: #ff6ec7;
            background: rgba(255,110,199,0.15);
            color: #ff6ec7;
        }

        .karaoke-toggle .toggle-dot {
            width: 32px; height: 18px;
            background: rgba(255,255,255,0.15);
            border-radius: 9px;
            position: relative;
            transition: all 0.2s;
        }

        .karaoke-toggle.active .toggle-dot {
            background: #ff6ec7;
        }

        .karaoke-toggle .toggle-dot::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 14px; height: 14px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .karaoke-toggle.active .toggle-dot::after {
            left: 16px;
        }

        .search-wrap { flex: 1; display: flex; gap: 6px; max-width: 500px; }

        .search-wrap input {
            flex: 1; padding: 10px 16px;
            border-radius: 22px; border: 2px solid #7c4dff;
            background: rgba(255,255,255,0.1); color: #fff;
            font-size: 1rem; outline: none;
        }

        .search-wrap input:focus { border-color: #ff6ec7; box-shadow: 0 0 12px rgba(255,110,199,0.3); }
        .search-wrap input::placeholder { color: rgba(255,255,255,0.4); }

        .search-btn {
            padding: 10px 20px; border-radius: 22px; border: none;
            background: linear-gradient(135deg, #7c4dff, #ff6ec7);
            color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer;
        }

        /* ===== PC Layout ===== */
        @media (min-width: 769px) {
            .app { display: flex; flex-direction: column; height: 100vh; }

            .pc-main {
                flex: 1; display: grid;
                grid-template-columns: 1fr 360px;
                grid-template-rows: 1fr auto;
                overflow: hidden;
            }

            .video-area {
                grid-column: 1; grid-row: 1;
                background: #000; position: relative;
                display: flex; align-items: center; justify-content: center;
            }

            .video-area #player { width: 100%; height: 100%; }

            .placeholder {
                text-align: center; color: rgba(255,255,255,0.2);
            }
            .placeholder .icon { font-size: 4rem; margin-bottom: 10px; }
            .placeholder p { font-size: 0.9rem; }

            .controls {
                grid-column: 1; grid-row: 2;
                background: #111; padding: 10px 16px;
                display: flex; align-items: center; gap: 10px;
            }

            .sidebar {
                grid-column: 2; grid-row: 1 / 3;
                background: #0f0f23;
                display: flex; flex-direction: column;
                border-left: 1px solid rgba(124,77,255,0.2);
            }

            .tabs { display: flex; background: #111; }

            .tab {
                flex: 1; padding: 12px; text-align: center;
                cursor: pointer; font-weight: bold; font-size: 0.82rem;
                color: rgba(255,255,255,0.4);
                border-bottom: 3px solid transparent;
            }

            .tab.active { color: #ff6ec7; border-bottom-color: #ff6ec7; }

            .now-playing {
                background: linear-gradient(135deg, #1a0533, #2d1b69);
                padding: 7px 12px; display: none;
                align-items: center; gap: 8px;
                border-bottom: 1px solid rgba(124,77,255,0.2);
            }

            .sidebar-content {
                flex: 1; overflow-y: auto; padding: 5px;
                -webkit-overflow-scrolling: touch;
            }

            .mobile-scroll { display: none; }
            .mobile-search { display: none; }
            .mobile-tabs { display: none; }
            .mobile-list { display: none; }
        }

        /* ===== Mobile Layout ===== */
        @media (max-width: 768px) {
            .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

            .header { padding: 8px 10px; gap: 6px; }
            .header h1 { font-size: 1rem; }

            .header .search-wrap { display: none; }
            .header .karaoke-toggle { display: none; }

            .mobile-search {
                display: flex; gap: 6px; padding: 8px 10px;
                background: linear-gradient(135deg, #1a0533, #2d1b69);
                align-items: center;
            }

            .mobile-search .search-wrap { flex: 1; display: flex; gap: 6px; }

            .mobile-search .karaoke-toggle {
                display: flex; font-size: 0.7rem; padding: 5px 10px;
            }

            .pc-main { display: none; }

            .mobile-scroll {
                flex: 1; overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                display: flex; flex-direction: column;
            }

            .video-section {
                background: #000; position: relative;
                aspect-ratio: 16/9; max-height: 50vh; flex-shrink: 0;
            }

            .video-section #player { width: 100%; height: 100%; }

            .mobile-placeholder {
                position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                color: rgba(255,255,255,0.2);
            }
            .mobile-placeholder .icon { font-size: 3rem; margin-bottom: 8px; }
            .mobile-placeholder p { font-size: 0.8rem; }

            .mobile-controls {
                background: #111; padding: 8px 10px;
                display: flex; align-items: center; gap: 8px;
                flex-shrink: 0;
            }

            .mobile-tabs {
                display: flex; background: #111;
                border-top: 1px solid rgba(124,77,255,0.15);
                flex-shrink: 0;
            }

            .mobile-tabs .tab-btn {
                flex: 1; padding: 10px; text-align: center;
                font-weight: bold; font-size: 0.78rem;
                color: rgba(255,255,255,0.4); border: none; background: none;
                border-bottom: 3px solid transparent; cursor: pointer;
            }

            .mobile-tabs .tab-btn.active { color: #ff6ec7; border-bottom-color: #ff6ec7; }

            .mobile-np {
                background: linear-gradient(135deg, #1a0533, #2d1b69);
                padding: 6px 10px; display: none;
                align-items: center; gap: 7px; flex-shrink: 0;
            }

            .mobile-list {
                flex: 1; overflow-y: auto; padding: 5px;
                -webkit-overflow-scrolling: touch;
            }

            .sidebar { display: none; }
        }

        /* ===== Shared ===== */
        .np-dot {
            width: 6px; height: 6px; background: #ff6ec7;
            border-radius: 50%; animation: pulse 1.2s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .np-title {
            font-size: 0.78rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
        }

        .ctrls { display: flex; gap: 4px; }

        .ctrl {
            background: none; border: none; color: #fff;
            font-size: 1.2rem; cursor: pointer; padding: 5px; border-radius: 50%;
        }

        .ctrl:hover { background: rgba(255,255,255,0.1); }

        .time {
            font-size: 0.78rem; color: rgba(255,255,255,0.5);
            min-width: 36px; text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .progress {
            flex: 1; height: 5px; background: rgba(255,255,255,0.1);
            border-radius: 3px; cursor: pointer;
        }

        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #7c4dff, #ff6ec7);
            border-radius: 3px; width: 0%;
        }

        .vol { width: 50px; accent-color: #7c4dff; cursor: pointer; }

        .fs-btn {
            position: absolute; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 1.3rem; padding: 7px 9px;
            border-radius: 8px; cursor: pointer; z-index: 5;
        }

        .fs-close {
            display: none; position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 1.5rem; padding: 8px 12px;
            border-radius: 10px; cursor: pointer; z-index: 10;
        }

        .pane { display: none; }
        .pane.active { display: block; }

        .song {
            display: flex; gap: 8px; padding: 8px;
            border-radius: 8px; cursor: pointer; align-items: center;
        }

        .song:hover { background: rgba(124,77,255,0.1); }
        .song.playing { background: rgba(255,110,199,0.1); border: 1px solid rgba(255,110,199,0.2); }

        .song-thumb {
            width: 72px; height: 44px; border-radius: 5px;
            object-fit: cover; flex-shrink: 0; background: #222;
        }

        .song-info { flex: 1; min-width: 0; }

        .song-title {
            font-size: 0.78rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .song-meta { font-size: 0.66rem; color: rgba(255,255,255,0.3); margin-top: 1px; }

        .act {
            background: none; border: none;
            color: rgba(255,255,255,0.3); cursor: pointer;
            padding: 4px 6px; border-radius: 4px; font-size: 0.9rem;
        }

        .act:hover { color: #ff6ec7; }
        .act.added { color: #0f0; }

        .loading { text-align: center; padding: 25px; color: rgba(255,255,255,0.3); }

        .spinner {
            display: inline-block; width: 22px; height: 22px;
            border: 3px solid rgba(124,77,255,0.2); border-top-color: #7c4dff;
            border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; padding: 25px 12px; color: rgba(255,255,255,0.2); }
        .empty .icon { font-size: 2rem; margin-bottom: 6px; }
        .empty p { font-size: 0.78rem; }

        /* Fullscreen */
        body.fs-mode .header { display: none !important; }
        body.fs-mode .controls, body.fs-mode .mobile-controls { display: none !important; }
        body.fs-mode .sidebar { display: none !important; }
        body.fs-mode .mobile-tabs, body.fs-mode .mobile-np, body.fs-mode .mobile-list { display: none !important; }

        body.fs-mode .app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: #000; }
        body.fs-mode .pc-main { grid-template-columns: 1fr; }
        body.fs-mode .video-area { grid-column: 1; }
        body.fs-mode .mobile-scroll { overflow: hidden; }
        body.fs-mode .video-section { flex: 1; aspect-ratio: unset; max-height: none; }
        body.fs-mode .fs-close { display: block; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <h1>🎤 Karaoke</h1>
            <button class="karaoke-toggle active" id="krToggle" onclick="toggleKaraoke()">
                🎤 เฉพาะคาราโอเกะ
                <div class="toggle-dot"></div>
            </button>
            <div class="search-wrap">
                <input type="text" id="q" placeholder="ค้นหาเพลงคาราโอเกะ..." />
                <button class="search-btn" onclick="doSearch()">🔍 ค้นหา</button>
            </div>
        </div>

        <!-- ===== PC Layout ===== -->
        <div class="pc-main">
            <div class="video-area" id="pcVideo">
                <div id="pcPh" class="placeholder">
                    <div class="icon">🎤</div>
                    <p>ค้นหาเพลงคาราโอเกะแล้วเริ่มร้องเลย!</p>
                </div>
                <div id="pcPlayer"></div>
                <button class="fs-btn" onclick="toggleFS()">⛶</button>
                <button class="fs-close" onclick="exitFS()">✕</button>
            </div>
            <div class="controls">
                <div class="ctrls">
                    <button class="ctrl" onclick="prev()">⏮</button>
                    <button class="ctrl" id="pcPP" onclick="togglePlay()">▶️</button>
                    <button class="ctrl" onclick="next()">⏭</button>
                </div>
                <span class="time" id="pcCur">0:00</span>
                <div class="progress" id="pcBar" onclick="seek(event)">
                    <div class="progress-fill" id="pcFill"></div>
                </div>
                <span class="time" id="pcDur">0:00</span>
                <span style="color:rgba(255,255,255,0.3);font-size:0.85rem">🔊</span>
                <input type="range" class="vol" min="0" max="100" value="80" oninput="setVol(this.value)" />
            </div>
            <div class="sidebar">
                <div class="tabs">
                    <div class="tab active" onclick="swTab('r')">🔍 ผลการค้นหา</div>
                    <div class="tab" onclick="swTab('p')">🎵 Playlist (<span id="pc">0</span>)</div>
                </div>
                <div class="now-playing" id="pcNp">
                    <div class="np-dot"></div>
                    <span class="np-title" id="pcNpt">-</span>
                </div>
                <div class="sidebar-content">
                    <div class="pane active" id="pcRP">
                        <div class="empty" id="pcRE">
                            <div class="icon">🔍</div>
                            <p>ค้นหาเพลงคาราโอเกะได้เลย!</p>
                        </div>
                        <div id="pcRL"></div>
                    </div>
                    <div class="pane" id="pcPP2">
                        <div class="empty" id="pcPE">
                            <div class="icon">🎵</div>
                            <p>ยังไม่มีเพลงใน Playlist</p>
                            <p style="font-size:0.7rem;margin-top:4px">กด ➕ เพิ่มเพลง</p>
                        </div>
                        <div id="pcPL"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Mobile Layout ===== -->
        <div class="mobile-scroll">
            <div class="mobile-search">
                <button class="karaoke-toggle active" id="krToggle2" onclick="toggleKaraoke()">
                    🎤 เฉพาะคาราโอเกะ
                    <div class="toggle-dot"></div>
                </button>
                <div class="search-wrap">
                    <input type="text" id="q2" placeholder="ค้นหาเพลงคาราโอเกะ..." />
                    <button class="search-btn" onclick="doSearch(document.getElementById('q2').value)">🔍</button>
                </div>
            </div>
            <div class="video-section" id="mVideo">
                <div id="mPh" class="mobile-placeholder">
                    <div class="icon">🎤</div>
                    <p>ค้นหาเพลงแล้วเริ่มร้องเลย!</p>
                </div>
                <div id="mPlayer"></div>
                <button class="fs-btn" onclick="toggleFS()">⛶</button>
                <button class="fs-close" onclick="exitFS()">✕</button>
            </div>
            <div class="mobile-controls">
                <div class="ctrls">
                    <button class="ctrl" onclick="prev()">⏮</button>
                    <button class="ctrl" id="mPP" onclick="togglePlay()">▶️</button>
                    <button class="ctrl" onclick="next()">⏭</button>
                </div>
                <span class="time" id="mCur">0:00</span>
                <div class="progress" id="mBar" onclick="seek(event)" ontouchstart="seek(event)">
                    <div class="progress-fill" id="mFill"></div>
                </div>
                <span class="time" id="mDur">0:00</span>
                <span style="color:rgba(255,255,255,0.3);font-size:0.8rem">🔊</span>
                <input type="range" class="vol" min="0" max="100" value="80" oninput="setVol(this.value)" />
            </div>
            <div class="mobile-tabs">
                <button class="tab-btn active" onclick="swTabM('r')">🔍 ผลการค้นหา</button>
                <button class="tab-btn" onclick="swTabM('p')">🎵 Playlist (<span id="mc">0</span>)</button>
            </div>
            <div class="mobile-np" id="mNp">
                <div class="np-dot"></div>
                <span class="np-title" id="mNpt">-</span>
            </div>
            <div class="mobile-list">
                <div class="pane active" id="mRP">
                    <div class="empty" id="mRE">
                        <div class="icon">🔍</div>
                        <p>ค้นหาเพลงคาราโอเกะได้เลย!</p>
                    </div>
                    <div id="mRL"></div>
                </div>
                <div class="pane" id="mPP2">
                    <div class="empty" id="mPE">
                        <div class="icon">🎵</div>
                        <p>ยังไม่มีเพลงใน Playlist</p>
                    </div>
                    <div id="mPL"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        let player, vid, playing = false, results = [], plist = JSON.parse(localStorage.getItem('kp')||'[]'), plIdx = -1, prog, fsMode = false;
        let karaokeOnly = localStorage.getItem('ko') !== '0'; // default on
        const isMobile = window.innerWidth <= 768;

        // YouTube IFrame
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const target = isMobile ? 'mPlayer' : 'pcPlayer';
            player = new YT.Player(target, {
                height: '100%', width: '100%',
                playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, fs: 0, iv_load_policy: 3 },
                events: { onReady: () => player.setVolume(80), onStateChange: onState }
            });
        }

        function onState(e) {
            if (e.data === YT.PlayerState.ENDED) next();
            playing = e.data === YT.PlayerState.PLAYING;
            const btn = isMobile ? 'mPP' : 'pcPP';
            document.getElementById(btn).textContent = playing ? '⏸' : '▶️';
            playing ? startProg() : stopProg();
        }

        // Toggle karaoke mode
        function toggleKaraoke() {
            karaokeOnly = !karaokeOnly;
            localStorage.setItem('ko', karaokeOnly ? '1' : '0');
            document.getElementById('krToggle').classList.toggle('active', karaokeOnly);
            document.getElementById('krToggle2').classList.toggle('active', karaokeOnly);
        }

        // Init toggle state
        document.getElementById('krToggle').classList.toggle('active', karaokeOnly);
        document.getElementById('krToggle2').classList.toggle('active', karaokeOnly);

        // Search
        async function doSearch(q) {
            q = q || document.getElementById('q').value.trim() || (document.getElementById('q2') ? document.getElementById('q2').value.trim() : '');
            if (!q) return;
            document.getElementById('q').value = q;
            if (document.getElementById('q2')) document.getElementById('q2').value = q;
            if (karaokeOnly) q = q + ' karaoke';
            const ph = isMobile ? 'mRE' : 'pcRE';
            const rl = isMobile ? 'mRL' : 'pcRL';
            document.getElementById(ph).style.display = 'none';
            document.getElementById(rl).innerHTML = '<div class="loading"><div class="spinner"></div><p>กำลังค้นหา...</p></div>';
            if (isMobile) swTabM('r'); else swTab('r');
            try {
                const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`, { signal: AbortSignal.timeout(30000) });
                const d = await r.json();
                if (d.error) throw new Error(d.error);
                results = d.results || [];
                renderR();
            } catch (e) {
                document.getElementById(rl).innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
            }
        }

        function renderR() {
            if (!results.length) {
                const msg = '<div class="empty"><div class="icon">😢</div><p>ไม่พบผลลัพธ์</p></div>';
                document.getElementById('pcRL').innerHTML = msg;
                document.getElementById('mRL').innerHTML = msg;
                return;
            }
            const html = results.map((s, i) => {
                const inP = plist.some(p => p.id === s.id);
                return `<div class="song ${vid===s.id?'playing':''}" onclick="play('${s.id}',\`${s.title.replace(/`/g,'\\`')}\`)">
                    <img class="song-thumb" src="${s.thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${s.id}/mqdefault.jpg'">
                    <div class="song-info"><div class="song-title">${s.title}</div><div class="song-meta">${s.channel}${s.duration?' · '+s.duration:''}</div></div>
                    <div><button class="act ${inP?'added':''}" onclick="event.stopPropagation();addPl(${i})">${inP?'✅':'➕'}</button></div>
                </div>`;
            }).join('');
            document.getElementById('pcRL').innerHTML = html;
            document.getElementById('mRL').innerHTML = html;
        }

        // Player
        function play(id, title) {
            if (!id || !player) return;
            vid = id;
            if (isMobile) {
                document.getElementById('mPh').style.display = 'none';
                document.getElementById('mPlayer').style.display = 'block';
                document.getElementById('mNp').style.display = 'flex';
                document.getElementById('mNpt').textContent = title;
            } else {
                document.getElementById('pcPh').style.display = 'none';
                document.getElementById('pcPlayer').style.display = 'block';
                document.getElementById('pcNp').style.display = 'flex';
                document.getElementById('pcNpt').textContent = title;
            }
            player.loadVideoById(id);
            const pi = plist.findIndex(p => p.id === id);
            if (pi >= 0) plIdx = pi;
            renderR(); renderP();
        }

        function togglePlay() { if (!player) return; playing ? player.pauseVideo() : player.playVideo(); }
        function prev() { if (!plist.length) return; plIdx = (plIdx-1+plist.length)%plist.length; play(plist[plIdx].id, plist[plIdx].title); }
        function next() { if (!plist.length) return; plIdx = (plIdx+1)%plist.length; play(plist[plIdx].id, plist[plIdx].title); }
        function setVol(v) { if (player?.setVolume) player.setVolume(v); }

        // Fullscreen
        function toggleFS() { fsMode ? exitFS() : enterFS(); }
        function enterFS() {
            fsMode = true; document.body.classList.add('fs-mode');
            try { if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch(e) {}
        }
        function exitFS() {
            fsMode = false; document.body.classList.remove('fs-mode');
            try { if (screen.orientation?.unlock) screen.orientation.unlock(); } catch(e) {}
        }

        // Progress
        function startProg() { stopProg(); prog = setInterval(updProg, 500); }
        function stopProg() { if (prog) clearInterval(prog); }
        function updProg() {
            if (!player?.getDuration) return;
            const c = player.getCurrentTime()||0, t = player.getDuration()||0;
            const pct = t>0?(c/t)*100:0;
            document.getElementById('pcFill').style.width = pct+'%';
            document.getElementById('mFill').style.width = pct+'%';
            document.getElementById('pcCur').textContent = fmt(c);
            document.getElementById('mCur').textContent = fmt(c);
            document.getElementById('pcDur').textContent = fmt(t);
            document.getElementById('mDur').textContent = fmt(t);
        }
        function seek(e) {
            if (!player?.getDuration) return;
            const b = e.currentTarget;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            player.seekTo(((cx-b.getBoundingClientRect().left)/b.width)*player.getDuration(), true);
        }

        // Playlist
        function addPl(i) {
            const s = results[i]; if (!s||plist.some(p=>p.id===s.id)) return;
            plist.push({id:s.id,title:s.title,channel:s.channel,thumb:s.thumb});
            saveP(); renderP(); renderR();
        }
        function rmPl(i) { plist.splice(i,1); if(plIdx>=plist.length)plIdx=plist.length-1; saveP();renderP();renderR(); }
        function playPl(i) { plIdx=i; play(plist[i].id,plist[i].title); }
        function saveP() { localStorage.setItem('kp',JSON.stringify(plist)); const c=plist.length; document.getElementById('pc').textContent=c; document.getElementById('mc').textContent=c; }
        function renderP() {
            const c = plist.length;
            document.getElementById('pc').textContent = c;
            document.getElementById('mc').textContent = c;
            if (!c) {
                document.getElementById('pcPE').style.display='block';
                document.getElementById('mPE').style.display='block';
                document.getElementById('pcPL').innerHTML=''; document.getElementById('mPL').innerHTML='';
                return;
            }
            document.getElementById('pcPE').style.display='none';
            document.getElementById('mPE').style.display='none';
            const html = plist.map((s,i)=>`<div class="song ${plIdx===i?'playing':''}" onclick="playPl(${i})">
                <img class="song-thumb" src="${s.thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${s.id}/mqdefault.jpg'">
                <div class="song-info"><div class="song-title">${s.title}</div><div class="song-meta">${s.channel}</div></div>
                <div><button class="act" onclick="event.stopPropagation();rmPl(${i})">🗑️</button></div>
            </div>`).join('');
            document.getElementById('pcPL').innerHTML = html;
            document.getElementById('mPL').innerHTML = html;
        }

        // Tabs - PC
        function swTab(t) {
            document.querySelectorAll('.pc-main .tab').forEach(x=>x.classList.remove('active'));
            document.querySelectorAll('.sidebar-content .pane').forEach(x=>x.classList.remove('active'));
            if(t==='r'){document.querySelectorAll('.pc-main .tab')[0].classList.add('active');document.getElementById('pcRP').classList.add('active');}
            else{document.querySelectorAll('.pc-main .tab')[1].classList.add('active');document.getElementById('pcPP2').classList.add('active');}
        }

        // Tabs - Mobile
        function swTabM(t) {
            document.querySelectorAll('.mobile-tabs .tab-btn').forEach(x=>x.classList.remove('active'));
            document.querySelectorAll('.mobile-list .pane').forEach(x=>x.classList.remove('active'));
            if(t==='r'){document.querySelectorAll('.mobile-tabs .tab-btn')[0].classList.add('active');document.getElementById('mRP').classList.add('active');}
            else{document.querySelectorAll('.mobile-tabs .tab-btn')[1].classList.add('active');document.getElementById('mPP2').classList.add('active');}
        }

        function fmt(s) { s=Math.floor(s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }

        document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
        if (document.getElementById('q2')) {
            document.getElementById('q2').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(document.getElementById('q2').value); });
        }
        renderP();
    </script>
</body>
</html>
