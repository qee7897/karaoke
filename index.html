<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>🎤 Karaoke Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* ===== Layout ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ===== Search Bar ===== */
        .search-bar {
            background: linear-gradient(135deg, #1a0533, #2d1b69);
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            box-shadow: 0 2px 15px rgba(128, 0, 255, 0.3);
            flex-shrink: 0;
        }

        .search-bar h1 {
            font-size: 1.1rem;
            background: linear-gradient(90deg, #ff6ec7, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .search-input-wrap {
            flex: 1;
            display: flex;
            gap: 6px;
        }

        .search-input-wrap input {
            flex: 1;
            padding: 9px 14px;
            border-radius: 22px;
            border: 2px solid #7c4dff;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input-wrap input:focus { border-color: #ff6ec7; }
        .search-input-wrap input::placeholder { color: rgba(255,255,255,0.4); }

        .search-btn {
            padding: 9px 16px;
            border-radius: 22px;
            border: none;
            background: linear-gradient(135deg, #7c4dff, #ff6ec7);
            color: #fff;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        /* ===== Content Area (scrollable) ===== */
        .content-wrap {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }

        /* ===== Video ===== */
        .video-section {
            background: #000;
            position: relative;
            flex-shrink: 0;
            aspect-ratio: 16/9;
            max-height: 50vh;
        }

        .video-section iframe,
        .video-section #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.2);
        }

        .placeholder .icon { font-size: 3.5rem; margin-bottom: 8px; }
        .placeholder p { font-size: 0.85rem; }

        .fs-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.3rem;
            padding: 7px 9px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 5;
        }

        /* ===== Controls ===== */
        .controls {
            background: #111;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .ctrls { display: flex; gap: 3px; }

        .ctrl {
            background: none; border: none; color: #fff;
            font-size: 1.1rem; cursor: pointer; padding: 5px;
            border-radius: 50%;
        }

        .time {
            font-size: 0.72rem; color: rgba(255,255,255,0.5);
            min-width: 32px; text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .progress {
            flex: 1; height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px; cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7c4dff, #ff6ec7);
            border-radius: 3px; width: 0%;
        }

        .vol { width: 45px; accent-color: #7c4dff; cursor: pointer; }

        /* ===== Tabs ===== */
        .tabs-row {
            display: flex;
            background: #111;
            border-top: 1px solid rgba(124,77,255,0.15);
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            border: none;
            background: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
        }

        .tab-btn.active {
            color: #ff6ec7;
            border-bottom-color: #ff6ec7;
        }

        /* ===== Now Playing ===== */
        .now-playing {
            background: linear-gradient(135deg, #1a0533, #2d1b69);
            padding: 6px 10px;
            display: none;
            align-items: center;
            gap: 7px;
            border-bottom: 1px solid rgba(124,77,255,0.2);
            flex-shrink: 0;
        }

        .np-dot {
            width: 6px; height: 6px; background: #ff6ec7;
            border-radius: 50%; animation: pulse 1.2s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .np-title {
            font-size: 0.75rem; font-weight: 600;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; flex: 1;
        }

        /* ===== Quick Tags ===== */
        .quick-tags {
            display: flex; gap: 5px; flex-wrap: nowrap;
            padding: 8px 10px;
            overflow-x: auto;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .qt {
            padding: 4px 10px; border-radius: 12px;
            border: 1px solid rgba(124,77,255,0.3);
            background: transparent; color: rgba(255,255,255,0.45);
            font-size: 0.7rem; cursor: pointer; white-space: nowrap;
            flex-shrink: 0;
        }

        .qt:active { border-color: #ff6ec7; color: #ff6ec7; }

        /* ===== Song List ===== */
        .song-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .pane { display: none; }
        .pane.active { display: block; }

        .song {
            display: flex; gap: 8px; padding: 8px;
            border-radius: 8px; cursor: pointer;
            align-items: center;
        }

        .song:active { background: rgba(124,77,255,0.1); }
        .song.playing { background: rgba(255,110,199,0.1); border: 1px solid rgba(255,110,199,0.2); }

        .song-thumb {
            width: 72px; height: 44px; border-radius: 5px;
            object-fit: cover; flex-shrink: 0; background: #222;
        }

        .song-info { flex: 1; min-width: 0; }

        .song-title {
            font-size: 0.76rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .song-meta { font-size: 0.65rem; color: rgba(255,255,255,0.3); margin-top: 1px; }

        .act {
            background: none; border: none;
            color: rgba(255,255,255,0.3); cursor: pointer;
            padding: 4px 6px; border-radius: 4px;
            font-size: 0.9rem; flex-shrink: 0;
        }

        .act.added { color: #0f0; }

        .loading { text-align: center; padding: 25px; color: rgba(255,255,255,0.3); }

        .spinner {
            display: inline-block; width: 22px; height: 22px;
            border: 3px solid rgba(124,77,255,0.2);
            border-top-color: #7c4dff; border-radius: 50%;
            animation: spin 0.7s linear infinite; margin-bottom: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; padding: 25px 12px; color: rgba(255,255,255,0.2); }
        .empty .icon { font-size: 2rem; margin-bottom: 6px; }
        .empty p { font-size: 0.78rem; }

        /* ===== Fullscreen ===== */
        body.fs-mode .search-bar,
        body.fs-mode .controls,
        body.fs-mode .tabs-row,
        body.fs-mode .now-playing,
        body.fs-mode .quick-tags,
        body.fs-mode .song-list { display: none !important; }

        body.fs-mode .app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: #000; }

        body.fs-mode .video-section {
            flex: 1;
            aspect-ratio: unset;
            max-height: none;
        }

        body.fs-mode .fs-close { display: block; }

        .fs-close {
            display: none;
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 1.5rem;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            z-index: 10;
        }

        /* ===== Desktop ===== */
        @media (min-width: 769px) {
            .app {
                display: grid;
                grid-template-rows: auto 1fr;
                grid-template-columns: 1fr 360px;
            }

            .search-bar {
                grid-column: 1 / -1;
                grid-row: 1;
            }

            .content-wrap {
                grid-column: 1;
                grid-row: 2;
                display: grid;
                grid-template-rows: 1fr auto;
                grid-template-columns: 1fr;
                overflow: hidden;
            }

            .video-section {
                grid-row: 1;
                max-height: none;
                aspect-ratio: unset;
            }

            .controls { grid-row: 2; }

            .desktop-sidebar {
                grid-column: 2;
                grid-row: 2;
                display: flex;
                flex-direction: column;
                background: #0f0f23;
                border-left: 1px solid rgba(124,77,255,0.2);
                overflow: hidden;
            }

            .tabs-row { display: none; }
            .now-playing { display: none !important; }
            .now-playing.show-np { display: flex !important; }
            .quick-tags-desktop { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .song-list { overflow-y: auto; flex: 1; }

            body.fs-mode .desktop-sidebar { display: none; }
            body.fs-mode .content-wrap { grid-column: 1 / -1; }
        }

        @media (max-width: 768px) {
            .desktop-sidebar { display: none !important; }
            .quick-tags-desktop { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 1. Search -->
        <div class="search-bar">
            <h1>🎤 Karaoke</h1>
            <div class="search-input-wrap">
                <input type="text" id="q" placeholder="ค้นหาเพลงคาราโอเกะ..." />
                <button class="search-btn" onclick="doSearch()">🔍</button>
            </div>
        </div>

        <!-- Main content -->
        <div class="content-wrap">
            <!-- 2. Video -->
            <div class="video-section" id="videoArea">
                <div id="ph" class="placeholder">
                    <div class="icon">🎤</div>
                    <p>ค้นหาเพลงแล้วเริ่มร้องเลย!</p>
                </div>
                <div id="player"></div>
                <button class="fs-btn" onclick="toggleFS()">⛶</button>
                <button class="fs-close" onclick="exitFS()">✕</button>
            </div>

            <!-- Controls -->
            <div class="controls">
                <div class="ctrls">
                    <button class="ctrl" onclick="prev()">⏮</button>
                    <button class="ctrl" id="pp" onclick="togglePlay()">▶️</button>
                    <button class="ctrl" onclick="next()">⏭</button>
                </div>
                <span class="time" id="cur">0:00</span>
                <div class="progress" id="pbar" onclick="seek(event)" ontouchstart="seek(event)">
                    <div class="progress-fill" id="pfill"></div>
                </div>
                <span class="time" id="dur">0:00</span>
                <span style="color:rgba(255,255,255,0.3);font-size:0.8rem">🔊</span>
                <input type="range" class="vol" min="0" max="100" value="80" oninput="setVol(this.value)" />
            </div>
        </div>

        <!-- 3. Tabs (mobile) -->
        <div class="tabs-row">
            <button class="tab-btn active" onclick="swTab('r')">🔍 ผลการค้นหา</button>
            <button class="tab-btn" onclick="swTab('p')">🎵 Playlist (<span id="pc">0</span>)</button>
        </div>

        <!-- Now Playing -->
        <div class="now-playing" id="np">
            <div class="np-dot"></div>
            <span class="np-title" id="npt">-</span>
        </div>

        <!-- Quick tags -->
        <div class="quick-tags">
            <button class="qt" onclick="qs('ลูกอม คาราโอเกะ')">ลูกอม</button>
            <button class="qt" onclick="qs('คนเก่ง คาราโอเกะ')">คนเก่ง</button>
            <button class="qt" onclick="qs('แพ้ทาง คาราโอเกะ')">แพ้ทาง</button>
            <button class="qt" onclick="qs('ปล่อย คาราโอเกะ')">ปล่อย</button>
            <button class="qt" onclick="qs('รถแห่ คาราโอเกะ')">รถแห่</button>
            <button class="qt" onclick="qs('ผู้สาวขาเลาะ คาราโอเกะ')">ผู้สาวขาเลาะ</button>
            <button class="qt" onclick="qs('กอดเสาเถียง คาราโอเกะ')">กอดเสาเถียง</button>
            <button class="qt" onclick="qs('say so karaoke')">Say So</button>
        </div>

        <!-- 4 & 5. Song list area -->
        <div class="song-list">
            <div class="pane active" id="rp">
                <div class="empty" id="re">
                    <div class="icon">🔍</div>
                    <p>ค้นหาเพลงคาราโอเกะได้เลย!</p>
                </div>
                <div id="rl"></div>
            </div>
            <div class="pane" id="pp2">
                <div class="empty" id="pe">
                    <div class="icon">🎵</div>
                    <p>ยังไม่มีเพลงใน Playlist</p>
                    <p style="font-size:0.7rem;margin-top:4px">กด ➕ เพิ่มเพลง</p>
                </div>
                <div id="pl"></div>
            </div>
        </div>

        <!-- Desktop sidebar (hidden on mobile) -->
        <div class="desktop-sidebar">
            <div class="now-playing show-np" id="np2" style="display:none">
                <div class="np-dot"></div>
                <span class="np-title" id="npt2">-</span>
            </div>
            <div class="quick-tags-desktop">
                <button class="qt" onclick="qs('ลูกอม คาราโอเกะ')">ลูกอม</button>
                <button class="qt" onclick="qs('คนเก่ง คาราโอเกะ')">คนเก่ง</button>
                <button class="qt" onclick="qs('แพ้ทาง คาราโอเกะ')">แพ้ทาง</button>
                <button class="qt" onclick="qs('ปล่อย คาราโอเกะ')">ปล่อย</button>
                <button class="qt" onclick="qs('รถแห่ คาราโอเกะ')">รถแห่</button>
                <button class="qt" onclick="qs('ผู้สาวขาเลาะ คาราโอเกะ')">ผู้สาวขาเลาะ</button>
            </div>
            <div class="tabs-row" style="display:flex">
                <button class="tab-btn active" onclick="swTab('r')">🔍 ผลการค้นหา</button>
                <button class="tab-btn" onclick="swTab('p')">🎵 Playlist (<span id="pc2">0</span>)</button>
            </div>
            <div class="song-list">
                <div class="pane active" id="rp2">
                    <div class="empty" id="re2">
                        <div class="icon">🔍</div>
                        <p>ค้นหาเพลงคาราโอเกะได้เลย!</p>
                    </div>
                    <div id="rl2"></div>
                </div>
                <div class="pane" id="pp3">
                    <div class="empty" id="pe2">
                        <div class="icon">🎵</div>
                        <p>ยังไม่มีเพลงใน Playlist</p>
                    </div>
                    <div id="pl2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        let player, vid, playing = false, results = [], plist = JSON.parse(localStorage.getItem('kp')||'[]'), plIdx = -1, prog, fsMode = false;

        // ===== YouTube IFrame =====
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, fs: 0, iv_load_policy: 3 },
                events: { onReady: () => player.setVolume(80), onStateChange: onState }
            });
        }

        function onState(e) {
            if (e.data === YT.PlayerState.ENDED) next();
            playing = e.data === YT.PlayerState.PLAYING;
            document.getElementById('pp').textContent = playing ? '⏸' : '▶️';
            playing ? startProg() : stopProg();
        }

        // ===== Server Check =====
        async function chk() {
            try {
                const r = await fetch(API + '/api/health', { signal: AbortSignal.timeout(3000) });
                const d = await r.json();
                if (d.status === 'ok') return;
            } catch {}
        }
        chk(); setInterval(chk, 15000);

        // ===== Search =====
        async function doSearch(q) {
            q = q || document.getElementById('q').value.trim();
            if (!q) return;
            document.getElementById('q').value = q;
            hide('re'); hide('re2');
            setHTML('rl', '<div class="loading"><div class="spinner"></div><p>กำลังค้นหา...</p></div>');
            setHTML('rl2', '<div class="loading"><div class="spinner"></div><p>กำลังค้นหา...</p></div>');
            swTab('r');
            try {
                const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`, { signal: AbortSignal.timeout(30000) });
                const d = await r.json();
                if (d.error) throw new Error(d.error);
                results = d.results || [];
                renderR();
            } catch (e) {
                const msg = `<div class="empty"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
                setHTML('rl', msg);
                setHTML('rl2', msg);
            }
        }

        function qs(t) { document.getElementById('q').value = t; doSearch(t); }

        // ===== Render =====
        function renderR() {
            if (!results.length) {
                const msg = '<div class="empty"><div class="icon">😢</div><p>ไม่พบผลลัพธ์</p></div>';
                setHTML('rl', msg); setHTML('rl2', msg);
                return;
            }
            const html = results.map((s, i) => {
                const inP = plist.some(p => p.id === s.id);
                return `<div class="song ${vid===s.id?'playing':''}" onclick="play('${s.id}',\`${s.title.replace(/`/g,'\\`')}\`)">
                    <img class="song-thumb" src="${s.thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${s.id}/mqdefault.jpg'">
                    <div class="song-info"><div class="song-title">${s.title}</div><div class="song-meta">${s.channel}${s.duration?' · '+s.duration:''}</div></div>
                    <div><button class="act ${inP?'added':''}" onclick="event.stopPropagation();addPl(${i})">${inP?'✅':'➕'}</button></div>
                </div>`;
            }).join('');
            setHTML('rl', html); setHTML('rl2', html);
        }

        // ===== Player =====
        function play(id, title) {
            if (!id || !player) return;
            vid = id;
            hide('ph');
            document.getElementById('player').style.display = 'block';
            player.loadVideoById(id);
            show('np'); show('np2');
            document.getElementById('npt').textContent = title;
            document.getElementById('npt2').textContent = title;
            const pi = plist.findIndex(p => p.id === id);
            if (pi >= 0) plIdx = pi;
            renderR(); renderP();
        }

        function togglePlay() { if (!player) return; playing ? player.pauseVideo() : player.playVideo(); }
        function prev() { if (!plist.length) return; plIdx = (plIdx-1+plist.length)%plist.length; play(plist[plIdx].id, plist[plIdx].title); }
        function next() { if (!plist.length) return; plIdx = (plIdx+1)%plist.length; play(plist[plIdx].id, plist[plIdx].title); }
        function setVol(v) { if (player?.setVolume) player.setVolume(v); }

        // ===== Fullscreen =====
        function toggleFS() { fsMode ? exitFS() : enterFS(); }

        function enterFS() {
            fsMode = true;
            document.body.classList.add('fs-mode');
            try { if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch(e) {}
        }

        function exitFS() {
            fsMode = false;
            document.body.classList.remove('fs-mode');
            try { if (screen.orientation?.unlock) screen.orientation.unlock(); } catch(e) {}
        }

        // ===== Progress =====
        function startProg() { stopProg(); prog = setInterval(updProg, 500); }
        function stopProg() { if (prog) clearInterval(prog); }
        function updProg() {
            if (!player?.getDuration) return;
            const c = player.getCurrentTime()||0, t = player.getDuration()||0;
            document.getElementById('pfill').style.width = (t>0?(c/t)*100:0)+'%';
            document.getElementById('cur').textContent = fmt(c);
            document.getElementById('dur').textContent = fmt(t);
        }
        function seek(e) {
            if (!player?.getDuration) return;
            const b = document.getElementById('pbar');
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            player.seekTo(((cx-b.getBoundingClientRect().left)/b.width)*player.getDuration(), true);
        }

        // ===== Playlist =====
        function addPl(i) {
            const s = results[i]; if (!s||plist.some(p=>p.id===s.id)) return;
            plist.push({id:s.id,title:s.title,channel:s.channel,thumb:s.thumb});
            saveP(); renderP(); renderR();
        }
        function rmPl(i) { plist.splice(i,1); if(plIdx>=plist.length)plIdx=plist.length-1; saveP();renderP();renderR(); }
        function playPl(i) { plIdx=i; play(plist[i].id,plist[i].title); }
        function saveP() { localStorage.setItem('kp',JSON.stringify(plist)); const c=plist.length; setText('pc',c); setText('pc2',c); }
        function renderP() {
            const c = plist.length;
            setText('pc', c); setText('pc2', c);
            if (!c) {
                show('pe'); show('pe2');
                setHTML('pl',''); setHTML('pl2','');
                return;
            }
            hide('pe'); hide('pe2');
            const html = plist.map((s,i)=>`<div class="song ${plIdx===i?'playing':''}" onclick="playPl(${i})">
                <img class="song-thumb" src="${s.thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${s.id}/mqdefault.jpg'">
                <div class="song-info"><div class="song-title">${s.title}</div><div class="song-meta">${s.channel}</div></div>
                <div><button class="act" onclick="event.stopPropagation();rmPl(${i})">🗑️</button></div>
            </div>`).join('');
            setHTML('pl', html); setHTML('pl2', html);
        }

        // ===== Tabs =====
        function swTab(t) {
            document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
            document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
            const idx = t === 'r' ? 0 : 1;
            document.querySelectorAll('.tab-btn').forEach((b,i) => { if(i%2===idx) b.classList.add('active'); });
            document.getElementById('rp').classList.add('active');
            document.getElementById('pp2').classList.add('active');
            document.getElementById('rp2').classList.add('active');
            document.getElementById('pp3').classList.add('active');
            if (t === 'r') {
                document.getElementById('rp').classList.add('active');
                document.getElementById('rp2').classList.add('active');
            } else {
                document.getElementById('pp2').classList.add('active');
                document.getElementById('pp3').classList.add('active');
            }
        }

        // ===== Helpers =====
        function fmt(s) { s=Math.floor(s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }
        function setHTML(id, h) { document.getElementById(id).innerHTML = h; }
        function setText(id, t) { document.getElementById(id).textContent = t; }
        function show(id) { document.getElementById(id).style.display = ''; }
        function hide(id) { document.getElementById(id).style.display = 'none'; }

        document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
        renderP();
    </script>
</body>
</html>
