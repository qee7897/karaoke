<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 Karaoke Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a0533, #2d1b69);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 20px rgba(128, 0, 255, 0.3);
        }

        .header h1 {
            font-size: 1.3rem;
            background: linear-gradient(90deg, #ff6ec7, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .server-status {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .server-status.online { background: rgba(0,200,0,0.2); color: #0f0; }
        .server-status.offline { background: rgba(200,0,0,0.2); color: #f55; }

        .search-box {
            display: flex;
            gap: 6px;
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            flex: 1;
            padding: 9px 14px;
            border-radius: 22px;
            border: 2px solid #7c4dff;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: #ff6ec7;
            box-shadow: 0 0 12px rgba(255, 110, 199, 0.3);
        }

        .search-box input::placeholder { color: rgba(255,255,255,0.4); }

        .search-btn {
            padding: 9px 20px;
            border-radius: 22px;
            border: none;
            background: linear-gradient(135deg, #7c4dff, #ff6ec7);
            color: #fff;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(124, 77, 255, 0.5);
        }

        .main {
            display: grid;
            grid-template-columns: 1fr 340px;
            grid-template-rows: 1fr auto;
            height: calc(100vh - 56px);
        }

        .video-area {
            grid-column: 1;
            grid-row: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .placeholder {
            text-align: center;
            color: rgba(255,255,255,0.2);
        }

        .placeholder .icon { font-size: 4rem; margin-bottom: 12px; }
        .placeholder p { font-size: 0.9rem; }

        #player { width: 100%; height: 100%; }

        .controls-bar {
            grid-column: 1;
            grid-row: 2;
            background: #111;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrls { display: flex; gap: 4px; }

        .ctrl {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .ctrl:hover { background: rgba(255,255,255,0.1); transform: scale(1.1); }

        .time { font-size: 0.8rem; color: rgba(255,255,255,0.5); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }

        .progress {
            flex: 1;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7c4dff, #ff6ec7);
            border-radius: 3px;
            width: 0%;
        }

        .vol {
            width: 60px;
            accent-color: #7c4dff;
            cursor: pointer;
        }

        .sidebar {
            grid-column: 2;
            grid-row: 1 / 3;
            background: #0f0f23;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(124, 77, 255, 0.2);
        }

        .tabs { display: flex; background: #111; }

        .tab {
            flex: 1;
            padding: 11px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active { color: #ff6ec7; border-bottom-color: #ff6ec7; }
        .tab:hover { color: #fff; }

        .now-playing {
            background: linear-gradient(135deg, #1a0533, #2d1b69);
            padding: 7px 12px;
            display: none;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(124, 77, 255, 0.2);
        }

        .np-dot {
            width: 7px; height: 7px;
            background: #ff6ec7;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .now-playing .np-title {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .quick-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .qt {
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid rgba(124, 77, 255, 0.3);
            background: transparent;
            color: rgba(255,255,255,0.45);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qt:hover { border-color: #ff6ec7; color: #ff6ec7; }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: #7c4dff; border-radius: 2px; }

        .pane { display: none; }
        .pane.active { display: block; }

        .song {
            display: flex;
            gap: 8px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            align-items: center;
        }

        .song:hover { background: rgba(124, 77, 255, 0.1); }
        .song.playing { background: rgba(255, 110, 199, 0.1); border: 1px solid rgba(255, 110, 199, 0.2); }

        .song-thumb {
            width: 72px;
            height: 44px;
            border-radius: 5px;
            object-fit: cover;
            flex-shrink: 0;
            background: #222;
        }

        .song-info { flex: 1; min-width: 0; }

        .song-title {
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-meta { font-size: 0.68rem; color: rgba(255,255,255,0.3); }

        .song-act { display: flex; gap: 2px; }

        .act {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 3px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .act:hover { color: #ff6ec7; background: rgba(255, 110, 199, 0.1); }
        .act.added { color: #0f0; }

        .loading { text-align: center; padding: 30px; color: rgba(255,255,255,0.3); }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(124, 77, 255, 0.2);
            border-top-color: #7c4dff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; padding: 30px 15px; color: rgba(255,255,255,0.2); }
        .empty .icon { font-size: 2.5rem; margin-bottom: 8px; }
        .empty p { font-size: 0.8rem; }

        @media (max-width: 768px) {
            .main { grid-template-columns: 1fr; grid-template-rows: 40vw auto 1fr; }
            .sidebar { grid-column: 1; grid-row: 3; border-left: none; border-top: 1px solid rgba(124,77,255,0.2); }
            .header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎤 Karaoke</h1>
        <span class="server-status offline" id="status">⏳ กำลังเชื่อมต่อ...</span>
        <div class="search-box">
            <input type="text" id="q" placeholder="ค้นหาเพลงคาราโอเกะ..." />
            <button class="search-btn" onclick="doSearch()">🔍 ค้นหา</button>
        </div>
    </div>

    <div class="main">
        <div class="video-area">
            <div id="ph" class="placeholder">
                <div class="icon">🎤</div>
                <p>ค้นหาเพลงคาราโอเกะแล้วเริ่มร้องเลย!</p>
            </div>
            <div id="player" style="display:none"></div>
        </div>

        <div class="controls-bar">
            <div class="ctrls">
                <button class="ctrl" onclick="prev()">⏮</button>
                <button class="ctrl" id="pp" onclick="togglePlay()">▶️</button>
                <button class="ctrl" onclick="next()">⏭</button>
            </div>
            <span class="time" id="cur">0:00</span>
            <div class="progress" id="pbar" onclick="seek(event)">
                <div class="progress-fill" id="pfill"></div>
            </div>
            <span class="time" id="dur">0:00</span>
            <span style="color:rgba(255,255,255,0.3);font-size:0.8rem">🔊</span>
            <input type="range" class="vol" min="0" max="100" value="80" oninput="setVol(this.value)" />
        </div>

        <div class="sidebar">
            <div class="tabs">
                <div class="tab active" onclick="swTab('r')">🔍 ผลการค้นหา</div>
                <div class="tab" onclick="swTab('p')">🎵 Playlist (<span id="pc">0</span>)</div>
            </div>
            <div class="now-playing" id="np">
                <div class="np-dot"></div>
                <span class="np-title" id="npt">-</span>
            </div>
            <div class="quick-tags">
                <button class="qt" onclick="qs('ลูกอม คาราโอเกะ')">ลูกอม</button>
                <button class="qt" onclick="qs('คนเก่ง คาราโอเกะ')">คนเก่ง</button>
                <button class="qt" onclick="qs('แพ้ทาง คาราโอเกะ')">แพ้ทาง</button>
                <button class="qt" onclick="qs('ปล่อย คาราโอเกะ')">ปล่อย</button>
                <button class="qt" onclick="qs('รถแห่ คาราโอเกะ')">รถแห่</button>
                <button class="qt" onclick="qs('ผู้สาวขาเลาะ คาราโอเกะ')">ผู้สาวขาเลาะ</button>
                <button class="qt" onclick="qs('กอดเสาเถียง คาราโอเกะ')">กอดเสาเถียง</button>
                <button class="qt" onclick="qs('say so karaoke')">Say So</button>
            </div>
            <div class="content">
                <div class="pane active" id="rp">
                    <div class="empty" id="re">
                        <div class="icon">🔍</div>
                        <p>ค้นหาเพลงคาราโอเกะได้เลย!</p>
                    </div>
                    <div id="rl"></div>
                </div>
                <div class="pane" id="pp2">
                    <div class="empty" id="pe">
                        <div class="icon">🎵</div>
                        <p>ยังไม่มีเพลงใน Playlist</p>
                        <p style="font-size:0.72rem;margin-top:5px">กด ➕ เพิ่มเพลงจากผลการค้นหา</p>
                    </div>
                    <div id="pl"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        let player, vid, playing = false, results = [], plist = JSON.parse(localStorage.getItem('kp')||'[]'), plIdx = -1, prog;

        // YouTube IFrame
        const t = document.createElement('script');
        t.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(t);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, fs: 0, iv_load_policy: 3 },
                events: { onReady: () => player.setVolume(80), onStateChange: onState }
            });
        }

        function onState(e) {
            if (e.data === YT.PlayerState.ENDED) next();
            playing = e.data === YT.PlayerState.PLAYING;
            document.getElementById('pp').textContent = playing ? '⏸' : '▶️';
            playing ? startProg() : stopProg();
        }

        // Server check
        async function chk() {
            const el = document.getElementById('status');
            try {
                const r = await fetch(API + '/api/health', { signal: AbortSignal.timeout(3000) });
                const d = await r.json();
                if (d.status === 'ok') { el.className = 'server-status online'; el.textContent = '🟢 Online'; return; }
            } catch {}
            el.className = 'server-status offline'; el.textContent = '🔴 Offline';
        }
        chk(); setInterval(chk, 15000);

        // Search
        async function doSearch(q) {
            q = q || document.getElementById('q').value.trim();
            if (!q) return;
            document.getElementById('q').value = q;
            document.getElementById('re').style.display = 'none';
            document.getElementById('rl').innerHTML = '<div class="loading"><div class="spinner"></div><p>กำลังค้นหาคาราโอเกะ...</p></div>';
            swTab('r');
            try {
                const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`, { signal: AbortSignal.timeout(30000) });
                const d = await r.json();
                if (d.error) throw new Error(d.error);
                results = d.results || [];
                renderR();
            } catch (e) {
                document.getElementById('rl').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
            }
        }

        function qs(t) { document.getElementById('q').value = t; doSearch(t); }

        function renderR() {
            const el = document.getElementById('rl');
            if (!results.length) { el.innerHTML = '<div class="empty"><div class="icon">😢</div><p>ไม่พบผลลัพธ์</p></div>'; return; }
            el.innerHTML = results.map((s, i) => {
                const inP = plist.some(p => p.id === s.id);
                return `<div class="song ${vid===s.id?'playing':''}" onclick="play('${s.id}',\`${s.title.replace(/`/g,'\\`')}\`)">
                    <img class="song-thumb" src="${s.thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${s.id}/mqdefault.jpg'">
                    <div class="song-info"><div class="song-title">${s.title}</div><div class="song-meta">${s.channel}${s.duration?' · '+s.duration:''}</div></div>
                    <div class="song-act"><button class="act ${inP?'added':''}" onclick="event.stopPropagation();addPl(${i})" title="${inP?'อยู่ใน Playlist':'เพิ่ม'}">${inP?'✅':'➕'}</button></div>
                </div>`;
            }).join('');
        }

        function play(id, title) {
            if (!id || !player) return;
            vid = id;
            document.getElementById('ph').style.display = 'none';
            document.getElementById('player').style.display = 'block';
            player.loadVideoById(id);
            document.getElementById('np').style.display = 'flex';
            document.getElementById('npt').textContent = title;
            const pi = plist.findIndex(p => p.id === id);
            if (pi >= 0) plIdx = pi;
            renderR(); renderP();
        }

        function togglePlay() { if (!player) return; playing ? player.pauseVideo() : player.playVideo(); }
        function prev() { if (!plist.length) return; plIdx = (plIdx-1+plist.length)%plist.length; play(plist[plIdx].id, plist[plIdx].title); }
        function next() { if (!plist.length) return; plIdx = (plIdx+1)%plist.length; play(plist[plIdx].id, plist[plIdx].title); }
        function setVol(v) { if (player?.setVolume) player.setVolume(v); }

        function startProg() { stopProg(); prog = setInterval(updProg, 500); }
        function stopProg() { if (prog) clearInterval(prog); }
        function updProg() {
            if (!player?.getDuration) return;
            const c = player.getCurrentTime()||0, t = player.getDuration()||0;
            document.getElementById('pfill').style.width = (t>0?(c/t)*100:0)+'%';
            document.getElementById('cur').textContent = fmt(c);
            document.getElementById('dur').textContent = fmt(t);
        }
        function seek(e) {
            if (!player?.getDuration) return;
            const b = document.getElementById('pbar');
            player.seekTo(((e.clientX-b.getBoundingClientRect().left)/b.width)*player.getDuration(), true);
        }

        function addPl(i) {
            const s = results[i]; if (!s||plist.some(p=>p.id===s.id)) return;
            plist.push({id:s.id,title:s.title,channel:s.channel,thumb:s.thumb});
            saveP(); renderP(); renderR();
        }
        function rmPl(i) { plist.splice(i,1); if(plIdx>=plist.length)plIdx=plist.length-1; saveP();renderP();renderR(); }
        function playPl(i) { plIdx=i; play(plist[i].id,plist[i].title); }
        function saveP() { localStorage.setItem('kp',JSON.stringify(plist)); document.getElementById('pc').textContent=plist.length; }
        function renderP() {
            const el=document.getElementById('pl'), em=document.getElementById('pe');
            document.getElementById('pc').textContent=plist.length;
            if(!plist.length){em.style.display='block';el.innerHTML='';return;}
            em.style.display='none';
            el.innerHTML=plist.map((s,i)=>`<div class="song ${plIdx===i?'playing':''}" onclick="playPl(${i})">
                <img class="song-thumb" src="${s.thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${s.id}/mqdefault.jpg'">
                <div class="song-info"><div class="song-title">${s.title}</div><div class="song-meta">${s.channel}</div></div>
                <div class="song-act"><button class="act" onclick="event.stopPropagation();rmPl(${i})" title="ลบ">🗑️</button></div>
            </div>`).join('');
        }

        function swTab(t) {
            document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
            document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
            if(t==='r'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('rp').classList.add('active');}
            else{document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('pp2').classList.add('active');}
        }

        function fmt(s) { s=Math.floor(s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }

        document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
        renderP();
    </script>
</body>
</html>
